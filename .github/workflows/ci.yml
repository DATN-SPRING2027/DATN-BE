name: Backend CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: BE / Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: BE / Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run test:dev-db-smoke-safety

  migration-planner-tests:
    name: BE / Migration planner tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:migrations:plan

  typecheck-build:
    name: BE / Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e-tests:
    name: BE / E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:e2e -- --runInBand

  mongodb-integration-tests:
    name: BE / MongoDB transaction integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGODB_INTEGRATION: 'true'
      MONGODB_INTEGRATION_TARGET: datn-project-access-permission-provisioning-mongo7-disposable
      MONGODB_INTEGRATION_PORT: '27017'
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Start MongoDB replica set
        shell: bash
        run: |
          docker run --detach --name datn-mongo-rs --publish 27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec datn-mongo-rs mongosh --quiet --eval 'db.adminCommand("ping").ok' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec datn-mongo-rs mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'
          primary_ready=0
          for attempt in $(seq 1 30); do
            if docker exec datn-mongo-rs mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              primary_ready=1
              break
            fi
            sleep 1
          done
          if [ "$primary_ready" -ne 1 ]; then
            echo 'MongoDB replica set did not elect a primary.' >&2
            exit 1
          fi
          docker exec datn-mongo-rs mongosh --quiet --eval 'db.getSiblingDB("admin").getCollection("datn_migration_test_fixture").insertOne({_id:"datn-project-access-permission-provisioning-mongo7-disposable"})'
          docker exec datn-mongo-rs mongosh --quiet --eval 'db.getSiblingDB("admin").getCollection("datn_migration_test_fixture").insertOne({_id:"datn-87-membership-lifecycle-mongo7-disposable"})'
      - name: Run Project Access permission provisioning migration integration
        run: npm run test:project-access-permissions:integration
      - name: Run DATN-87 membership lifecycle migration integration
        env:
          MONGODB_INTEGRATION_TARGET: datn-87-membership-lifecycle-mongo7-disposable
          MONGODB_INTEGRATION_REPLICA_SET: rs0
        run: npm run test:membership-lifecycle:integration
      - name: Run Project and A-05 MongoDB integration suites
        run: >-
          npm test -- --runInBand --runTestsByPath
          src/services/iam/infrastructure/mongodb/project.repository.mongodb.spec.ts
          src/services/iam/infrastructure/mongodb/organization-provisioning.mongodb.spec.ts
