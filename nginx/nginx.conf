events {}

http {
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/s;
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/s;

  upstream api_gateway {
    server api-gateway:3000;
  }

  upstream chat_service {
    server chat:3005;
  }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # OBS-002 / SEC-BE-006: Never expose Prometheus metrics externally through edge Nginx.
    location = /api/v1/metrics {
      deny all;
      return 403;
    }

    location = /internal/chat/ws {
      proxy_pass http://chat_service;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
    }

    # SEC-BE-008: Block all other /internal/* namespaces from public ingress.
    location ^~ /internal/ {
      deny all;
      return 403;
    }

    # BE-REL-002 / INFRA-005: Unbuffered SSE streaming for AI Chat ask/regenerate.
    location ~ ^/api/v1/ai-chat/projects/[^/]+/threads/[^/]+/(?:ask|messages/[^/]+/regenerate)$ {
      limit_req zone=api_general burst=20 nodelay;
      proxy_pass http://api_gateway;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_read_timeout 150s;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-Id $http_x_request_id;
    }

    # Unbuffered 25MB uploads for Chat attachments and Capture documents/reports/notes.
    location ~ ^/api/v1/(?:chat/conversations/[^/]+/uploads/[^/]+/content|capture/projects/[^/]+/(?:documents|work-reports|work-notes)/[^/]+/file)$ {
      client_max_body_size 25m;
      proxy_request_buffering off;
      proxy_read_timeout 180s;
      proxy_pass http://api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-Id $http_x_request_id;
    }

    location ^~ /api/v1/auth/ {
      limit_req zone=api_auth burst=20 nodelay;
      proxy_pass http://api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-Id $http_x_request_id;
    }

    location ~ ^/api/v1/mcp/?$ {
      client_max_body_size 30m;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
      proxy_pass http://api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-Id $http_x_request_id;
    }

    location / {
      limit_req zone=api_general burst=100 nodelay;
      proxy_pass http://api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-Id $http_x_request_id;
    }
  }
}
