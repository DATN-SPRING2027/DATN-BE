image:
  repository: continuum-ai/backend
  tag: latest
  pullPolicy: IfNotPresent

gateway:
  replicas: 2
  port: 3000
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

cors:
  allowedOrigins: "https://app.continuum.local"

sag:
  serviceUrl: "http://sag-api:8000"
  # Set apiBaseUrl together with existingSecretName containing bffServiceTokenKey to enable SAG BFF calls.
  apiBaseUrl: ""
  existingSecretName: ""
  bffServiceTokenKey: "sag-bff-service-token"

metrics:
  authSecretKey: metrics-auth-token

serviceDefaults:
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

workerDefaults:
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 768Mi

auth:
  # Pre-create this Secret with jwt-secret and gateway-source-secret keys.
  existingSecretName: continuum-iam-auth
  # Exact CIDR(s) of trusted BFF/ingress peers; required when chart ingress is enabled.
  trustedProxyCidrs: ""

ingress:
  enabled: false
  className: nginx
  host: api.continuum.local
  tlsSecretName: continuum-api-tls

chat:
  # Origins are checked on the direct WebSocket endpoint; set the actual FE origins at install time.
  allowedOrigins: "https://api.continuum.local,http://localhost:3000"
  # 1-1 Direct Chat @continuumAI grounded assistant (disabled by default).
  # Leave workerEnabled as null to inherit dmAssistant.enabled in single-process deployments;
  # set workerEnabled: false explicitly on HTTP/WS pods in split-pod deployments.
  dmAssistant:
    enabled: false
    workerEnabled: null
    sagTimeoutMs: 45000
  # Documents use Cloudflare R2; image objects use AWS S3.
  r2:
    endpoint: ""
    bucket: ""
    existingSecretName: ""
  s3:
    region: ""
    bucket: ""
    existingSecretName: ""

services:
  iam: { port: 3001, database: continuum_iam, replicas: 1 }
  capture: { port: 3002, database: continuum_capture, replicas: 1 }
  jira: { port: 3003, database: continuum_jira, replicas: 1 }
  lifecycle: { port: 3004, database: continuum_lifecycle, replicas: 1 }
  chat: { port: 3005, database: continuum_chat, replicas: 1 }
  handover: { port: 3006, database: continuum_handover, replicas: 1 }
  ingestion: { port: 3007, database: continuum_ingestion, replicas: 1 }
  notification: { port: 3008, database: continuum_notification, replicas: 1 }

workers:
  notifications: { queue: notifications, replicas: 0, concurrency: 4 }
  outbox: { queue: outbox, replicas: 0, concurrency: 4 }
  ingestion: { queue: ingestion, replicas: 0, concurrency: 2 }
  handover: { queue: handover, replicas: 0, concurrency: 2 }
  dlq: { queue: dlq, replicas: 0, concurrency: 1 }

redis:
  image: redis:7.2-alpine
  replicas: 6
  port: 6379
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 640Mi
  auth:
    # Pre-create this Secret with a high-entropy `password` key.
    existingSecretName: continuum-redis-auth

mongodb:
  enabled: true
  image: mongo:7.0
  replicas: 3
  port: 27017
  auth:
    # Pre-create this Secret with the keys documented in charts/continuum-ai/README.md.
    existingSecretName: continuum-mongodb-auth

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

serviceMonitor:
  enabled: false
  interval: 15s
