{{- if .Values.mongodb.enabled }}
{{- $mongoName := include "continuum-ai.fullname" . -}}
{{- $mongoMembers := list -}}
{{- range $index, $_ := until (int .Values.mongodb.replicas) -}}
{{- $mongoMembers = append $mongoMembers (dict "_id" $index "host" (printf "%s-mongo-%d.%s-mongo-headless:%d" $mongoName $index $mongoName (int $.Values.mongodb.port))) -}}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "continuum-ai.fullname" . }}-mongo-headless
  labels:
    {{- include "continuum-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "continuum-ai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
  ports:
    - name: mongodb
      port: {{ .Values.mongodb.port }}
      targetPort: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "continuum-ai.fullname" . }}-mongo
  labels:
    {{- include "continuum-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
spec:
  serviceName: {{ include "continuum-ai.fullname" . }}-mongo-headless
  replicas: {{ .Values.mongodb.replicas }}
  selector:
    matchLabels:
      {{- include "continuum-ai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mongodb
  template:
    metadata:
      labels:
        {{- include "continuum-ai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mongodb
    spec:
      initContainers:
        - name: prepare-keyfile
          image: {{ .Values.mongodb.image }}
          command: ["sh", "-ec"]
          args:
            - >-
              test -s /keyfile-source/keyfile;
              cp /keyfile-source/keyfile /keyfile/keyfile;
              chown mongodb:mongodb /keyfile/keyfile;
              chmod 400 /keyfile/keyfile
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: keyfile-source
              mountPath: /keyfile-source
              readOnly: true
            - name: keyfile
              mountPath: /keyfile
      containers:
        - name: mongodb
          image: {{ .Values.mongodb.image }}
          command: ["docker-entrypoint.sh"]
          args: ["mongod", "--bind_ip_all", "--replSet", "rs0", "--keyFile", "/etc/mongodb-keyfile/keyfile"]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.auth.existingSecretName }}
                  key: root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.auth.existingSecretName }}
                  key: root-password
          ports:
            - name: mongodb
              containerPort: {{ .Values.mongodb.port }}
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - >-
                  mongosh --quiet --eval 'const uri = `mongodb://${encodeURIComponent(process.env.MONGO_INITDB_ROOT_USERNAME)}:${encodeURIComponent(process.env.MONGO_INITDB_ROOT_PASSWORD)}@localhost:{{ .Values.mongodb.port }}/admin?authSource=admin&directConnection=true`; const admin = connect(uri).getSiblingDB("admin"); if (admin.runCommand({ ping: 1 }).ok !== 1) quit(1);'
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: keyfile
              mountPath: /etc/mongodb-keyfile
              readOnly: true
      volumes:
        - name: keyfile-source
          secret:
            secretName: {{ .Values.mongodb.auth.existingSecretName }}
            defaultMode: 0400
            items:
              - key: keyfile
                path: keyfile
        - name: keyfile
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "continuum-ai.fullname" . }}-mongo-init
  labels:
    {{- include "continuum-ai.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        {{- include "continuum-ai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mongo-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongo-init
          image: {{ .Values.mongodb.image }}
          command: ["sh", "-ec"]
          args:
            - |
              until mongosh --quiet --eval '
                const uri = `mongodb://${encodeURIComponent(process.env.MONGO_INITDB_ROOT_USERNAME)}:${encodeURIComponent(process.env.MONGO_INITDB_ROOT_PASSWORD)}@${process.env.MONGO_HOST}/admin?authSource=admin&directConnection=true`;
                const admin = connect(uri).getSiblingDB("admin");
                if (admin.runCommand({ ping: 1 }).ok !== 1) quit(1);
              ' >/dev/null 2>&1; do sleep 2; done

              mongosh --quiet --eval '
                const uri = `mongodb://${encodeURIComponent(process.env.MONGO_INITDB_ROOT_USERNAME)}:${encodeURIComponent(process.env.MONGO_INITDB_ROOT_PASSWORD)}@${process.env.MONGO_HOST}/admin?authSource=admin&directConnection=true`;
                const admin = connect(uri).getSiblingDB("admin");
                let status;
                try {
                  status = admin.runCommand({ replSetGetStatus: 1 });
                } catch (error) {
                  if (error.code !== 94 && error.codeName !== "NotYetInitialized") throw error;
                  status = { ok: 0, code: 94 };
                }
                if (status.ok !== 1) {
                  if (status.code !== 94 && status.codeName !== "NotYetInitialized") throw new Error("Unable to read MongoDB replica-set status.");
                  const result = admin.runCommand({ replSetInitiate: {
                    _id: "rs0",
                    members: {{ $mongoMembers | toJson }}
                  } });
                  if (result.ok !== 1) throw new Error("MongoDB replica set initialization failed.");
                }
              '

              until mongosh --quiet --eval '
                const uri = `mongodb://${encodeURIComponent(process.env.MONGO_INITDB_ROOT_USERNAME)}:${encodeURIComponent(process.env.MONGO_INITDB_ROOT_PASSWORD)}@${process.env.MONGO_HOST}/admin?authSource=admin&directConnection=true`;
                const admin = connect(uri).getSiblingDB("admin");
                if (admin.runCommand({ hello: 1 }).isWritablePrimary !== true) quit(1);
              ' >/dev/null 2>&1; do sleep 2; done

              mongosh --quiet --eval '
                const uri = `mongodb://${encodeURIComponent(process.env.MONGO_INITDB_ROOT_USERNAME)}:${encodeURIComponent(process.env.MONGO_INITDB_ROOT_PASSWORD)}@${process.env.MONGO_HOST}/admin?authSource=admin&directConnection=true`;
                const admin = connect(uri).getSiblingDB("admin");
                const username = process.env.MONGO_APPLICATION_USERNAME;
                if (!username || username === process.env.MONGO_INITDB_ROOT_USERNAME) throw new Error("MongoDB application user must be distinct from the root user.");
                const password = process.env.MONGO_APPLICATION_PASSWORD;
                const roles = JSON.parse(process.env.MONGO_APPLICATION_ROLES);
                if (!password || roles.length === 0) throw new Error("MongoDB application credentials and database roles are required.");
                if (admin.getUser(username)) admin.updateUser(username, { pwd: password, roles });
                else admin.createUser({ user: username, pwd: password, roles });
              '
          env:
            - name: MONGO_HOST
              value: {{ include "continuum-ai.fullname" . }}-mongo-0.{{ include "continuum-ai.fullname" . }}-mongo-headless:{{ .Values.mongodb.port }}
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.auth.existingSecretName }}
                  key: root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.auth.existingSecretName }}
                  key: root-password
            - name: MONGO_APPLICATION_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.auth.existingSecretName }}
                  key: application-username
            - name: MONGO_APPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.auth.existingSecretName }}
                  key: application-password
            - name: MONGO_APPLICATION_ROLES
              value: {{ include "continuum-ai.mongodbApplicationRoles" . | quote }}
{{- end }}
