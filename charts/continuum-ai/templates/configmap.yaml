apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "continuum-ai.fullname" . }}-config
  labels:
    {{- include "continuum-ai.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  INFRA_ENABLED: "true"
  SWAGGER_ENABLED: "false"
  REDIS_MODE: cluster
  REDIS_CLUSTER_NODES: "{{ range $index, $_ := until (int .Values.redis.replicas) }}{{ if $index }},{{ end }}{{ include "continuum-ai.fullname" $ }}-redis-{{ $index }}.{{ include "continuum-ai.fullname" $ }}-redis-headless:{{ $.Values.redis.port }}{{ end }}"
  REDIS_PORT: {{ .Values.redis.port | quote }}
  BULLMQ_PREFIX: continuum
  MONGODB_AUTO_INDEX: "false"
  MONGODB_MAX_POOL_SIZE: "15"
  CORS_ALLOWED_ORIGINS: {{ .Values.cors.allowedOrigins | quote }}
  CAPTURE_FILE_TIMEOUT_MS: "120000"
  SAG_CHAT_STREAM_TIMEOUT_MS: "120000"
  SAG_LLM_TIMEOUT_MS: "90000"
  SAG_UNIVERSE_TIMEOUT_MS: "60000"
  SAG_SERVICE_URL: {{ .Values.sag.serviceUrl | quote }}
