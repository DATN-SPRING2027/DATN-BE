              projectId,
              memberId,
              memberName,
              frequency,
              periodStart,
              periodEnd,
              dueAt,
              status,
              createdAt,
              updatedAt,
              permissions,
            ]
          properties:
            id: { $ref: '#/components/schemas/ObjectId' }
            projectId: { $ref: '#/components/schemas/ObjectId' }
            memberId: { $ref: '#/components/schemas/ObjectId' }
            memberName: { type: string }
            reportScope: { $ref: '#/components/schemas/WorkReportScope' }
            frequency: { $ref: '#/components/schemas/ReportFrequency' }
            periodStart: { type: string, format: date-time }
            periodEnd: { type: string, format: date-time }
            dueAt: { type: string, format: date-time }
            status: { $ref: '#/components/schemas/WorkReportStatus' }
            file:
