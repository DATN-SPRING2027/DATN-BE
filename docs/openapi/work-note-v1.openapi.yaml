            properties:
              frequency: { $ref: '#/components/schemas/ReportFrequency' }
              effectiveAt: { type: string, format: date-time }
              updatedBy: { $ref: '#/components/schemas/ObjectId' }
        permissions:
          type: object
          required: [canConfigure]
          properties:
            canConfigure: { type: boolean }
            canReview: { type: boolean }
            canSubmit: { type: boolean }
    WorkReportSettings:
      type: object
      required:
        [projectId, frequency, effectiveAt, updatedBy, history, permissions]
      properties:
        projectId: { $ref: '#/components/schemas/ObjectId' }
        scope: { $ref: '#/components/schemas/WorkReportScope' }
        actorRole: { type: string, enum: [MANAGER, LEADER, MEMBER] }
        isManager: { type: boolean }
        isLeader: { type: boolean }
        hasActiveLeaders: { type: boolean }
        frequency: { $ref: '#/components/schemas/ReportFrequency' }
        effectiveAt: { type: string, format: date-time }
        nextFrequency: { $ref: '#/components/schemas/ReportFrequency' }
        nextEffectiveAt: { type: string, format: date-time }
        updatedBy: { $ref: '#/components/schemas/ObjectId' }
        history:
          type: array
          items:
            type: object
            required: [frequency, effectiveAt, updatedBy]
            properties:
              frequency: { $ref: '#/components/schemas/ReportFrequency' }
              effectiveAt: { type: string, format: date-time }
              updatedBy: { $ref: '#/components/schemas/ObjectId' }
        permissions:
          type: object
          required: [canConfigure]
          properties:
            canConfigure: { type: boolean }
            canReview: { type: boolean }
            canSubmit: { type: boolean }
