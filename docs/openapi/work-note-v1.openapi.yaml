        turnIds:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 200 }
    CanonicalTaskNote:
      type: object
      additionalProperties: false
      required:
        [id, projectId, taskId, authorId, authorName, type, status, title,
         contentMarkdown, contentSchemaVersion, currentVersionNumber, createdAt,
         updatedAt, permissions]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        projectId: { $ref: '#/components/schemas/ObjectId' }
        taskId: { $ref: '#/components/schemas/ObjectId' }
        authorId: { $ref: '#/components/schemas/ObjectId' }
        authorName: { type: string }
        type: { const: TASK_NOTE }
        status: { const: CONFIRMED }
        title: { type: string, maxLength: 300 }
        contentMarkdown: { type: string, maxLength: 30000 }
        contentSchemaVersion: { const: 2 }
        currentVersionNumber: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        permissions: { $ref: '#/components/schemas/Permissions' }
        aiChatSource: { $ref: '#/components/schemas/AiChatTaskNoteSource' }
    AiChatTaskNoteSource:
      type: object
      additionalProperties: false
      required: [threadId, messageId, citations, sessionCitations]
      properties:
        threadId: { type: string, minLength: 1, maxLength: 200 }
        messageId: { type: string, minLength: 1, maxLength: 200 }
        citations:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AiChatTaskNoteCitation' }
        sessionCitations:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AiChatTaskNoteSessionCitation' }
    AiChatTaskNoteCitation:
      allOf:
        - $ref: '#/components/schemas/AiChatTaskNoteCitationInput'
        - type: object
          properties:
            documentName: { type: string, maxLength: 240 }
    AiChatTaskNoteSessionCitation:
      $ref: '#/components/schemas/AiChatTaskNoteSessionCitationInput'
    DocumentType:
      type: string
      enum:
        [
          MVP,
          DATABASE_DESIGN,
          RSR,
          ARCHITECTURE,
          API_SPECIFICATION,
          RESEARCH,
          REQUIREMENT,
          DESIGN,
          TECHNICAL_SPECIFICATION,
          OTHER,
        ]
    DocumentStatus:
      type: string
      enum:
        [DRAFT, PENDING_REVIEW, APPROVED, CHANGES_REQUESTED, REJECTED, ARCHIVED]
    ProjectDocumentInput:
      type: object
      additionalProperties: false
      required: [title, type, content]
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 2000 }
        type: { $ref: '#/components/schemas/DocumentType' }
        content: { type: string, maxLength: 200000 }
    ReviewInput:
      type: object
      additionalProperties: false
      properties:
        comment: { type: string, maxLength: 5000 }
      description: A comment is required for request-changes and reject operations.
    ProjectDocumentSummary:
      type: object
      required:
        [
          id,
          projectId,
          title,
          type,
          version,
          status,
          createdBy,
          createdAt,
          updatedAt,
          permissions,
        ]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        projectId: { $ref: '#/components/schemas/ObjectId' }
        title: { type: string }
        description: { type: string }
        type: { $ref: '#/components/schemas/DocumentType' }
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        createdBy: { $ref: '#/components/schemas/ObjectId' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        submittedAt: { type: [string, 'null'], format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewedBy: { type: [string, 'null'] }
        reviewComment: { type: [string, 'null'] }
        permissions: { $ref: '#/components/schemas/Permissions' }
    ProjectDocument:
      allOf:
        - $ref: '#/components/schemas/ProjectDocumentSummary'
        - type: object
          required: [content, versions, reviewHistory]
          properties:
            content: { type: string }
            file: { $ref: '#/components/schemas/ProjectDocumentFile' }
            versions:
              type: array
              items:
                type: object
                required: [version, status, createdAt, editedBy]
                properties:
                  version: { type: integer, minimum: 1 }
                  status: { $ref: '#/components/schemas/DocumentStatus' }
                  createdAt: { type: string, format: date-time }
                  editedBy: { $ref: '#/components/schemas/ObjectId' }
                  file: { $ref: '#/components/schemas/ProjectDocumentFile' }
            reviewHistory:
              type: array
              items: { $ref: '#/components/schemas/ReviewEvent' }
    ProjectDocumentFile:
      type: object
      required: [name, contentType, size]
      properties:
        name: { type: string }
        contentType:
          {
            type: string,
            enum:
              [
                application/pdf,
                application/vnd.openxmlformats-officedocument.wordprocessingml.document,
              ],
          }
        size: { type: integer, minimum: 1, maximum: 20971520 }
    ReviewEvent:
      type: object
      required: [action, reviewerId, at]
      properties:
        action:
          {
            type: string,
            enum: [PENDING_REVIEW, APPROVED, CHANGES_REQUESTED, REJECTED],
          }
        reviewerId: { $ref: '#/components/schemas/ObjectId' }
        reviewerRole: { type: string, enum: [MANAGER, LEADER] }
        comment: { type: string }
        at: { type: string, format: date-time }
    WorkReportScope:
      type: string
      enum: [MEMBER, LEADER]
    ReportFrequency:
      type: string
      enum:
        [
          DAILY,
          EVERY_2_DAYS,
          EVERY_3_DAYS,
          EVERY_4_DAYS,
          EVERY_5_DAYS,
          EVERY_6_DAYS,
          WEEKLY,
        ]
    WorkReportTierSettingsSummary:
      type: object
      required: [frequency, effectiveAt, updatedBy, history, permissions]
      properties:
        frequency: { $ref: '#/components/schemas/ReportFrequency' }
        effectiveAt: { type: string, format: date-time }
        nextFrequency: { $ref: '#/components/schemas/ReportFrequency' }
        nextEffectiveAt: { type: string, format: date-time }
        updatedBy: { $ref: '#/components/schemas/ObjectId' }
        history:
          type: array
          items:
            type: object
