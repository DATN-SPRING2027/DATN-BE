openapi: 3.1.0
info:
  title: Continuum AI Work Notes API
  version: 1.1.0
  description: |
    Contract for Task Notes, Project Documents and Periodic Work Reports.
    This contract implements the product decisions in the Work Note Full
    Implementation request dated 2026-10-24. Public paths are served under
    /api/v1/capture by the Capture service and Gateway. Version 1.1.0 adds
    requester-approved saving of an AI Chat answer as a Task Note with
    project-scoped citation provenance.
  x-approval-status: APPROVED_BY_PRODUCT_REQUEST
  x-approval-reference: Work Note Full Implementation request, 2026-10-24; AI Chat answer to Task Note request, 2026-11-01
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerSession: []
tags:
  - name: TaskNotes
  - name: ProjectDocuments
  - name: WorkReports
paths:
  /capture/projects/{projectId}/tasks/{taskId}/notes:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [TaskNotes]
      operationId: listTaskNotes
      summary: List notes for a task
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Notes visible to active Project members
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TaskNote' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [TaskNotes]
      operationId: createTaskNote
      summary: Create an operational note for a task
      description: Task Notes are confirmed on creation and do not require Leader review or enter official AI knowledge automatically.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskNoteInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskNote' }
        default: { $ref: '#/components/responses/Error' }
  /capture/projects/{projectId}/tasks/{taskId}/notes/{noteId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/NoteId'
    get:
      tags: [TaskNotes]
      operationId: getTaskNote
      responses:
        '200':
          description: Task Note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskNote' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [TaskNotes]
      operationId: updateTaskNote
      description: The author or an authorized Project reviewer may edit a confirmed Task Note.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskNoteInput' }
      responses:
        '200':
          description: Updated Task Note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskNote' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [TaskNotes]
      operationId: deleteTaskNote
      description: Soft deletes a Task Note for its author or an authorized Project reviewer.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Task Note deleted }
        default: { $ref: '#/components/responses/Error' }
  /capture/projects/{projectId}/work-notes:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [TaskNotes]
      operationId: listProjectTaskNotes
      summary: List operational Task Notes in a Project
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: taskId
          in: query
          schema: { $ref: '#/components/schemas/ObjectId' }
      responses:
        '200':
          description: Project-scoped Task Notes
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TaskNote' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        default: { $ref: '#/components/responses/Error' }
  /capture/projects/{projectId}/work-notes/{noteId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/NoteId'
    get:
      tags: [TaskNotes]
      operationId: getProjectTaskNote
      summary: Resolve a project-scoped Task Note notification target
      description: Returns only a confirmed Task Note whose linked Task still belongs to the requested Project and is accessible to the caller.
      responses:
        '200':
          description: Task Note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskNote' }
        default: { $ref: '#/components/responses/Error' }
  /capture/projects/{projectId}/work-note-drafts/{draftId}/save:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: draftId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [TaskNotes]
      operationId: saveTaskNoteEditorDraft
      summary: Confirm a Task Note editor draft
      description: |
        Saves a user-owned editor draft for a Task in the requested Project as
        a confirmed, versioned Task Note. When aiChatSource is provided, the
        server validates every mapped Project Document reference against the
        same Organization and Project and derives its display name from that
        record. Conversation citations retain identifiers only; excerpts and
        caller-provided URLs are not accepted.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskNoteEditorSaveInput' }
      responses:
        '200':
          description: Confirmed versioned Task Note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalTaskNote' }
        default: { $ref: '#/components/responses/Error' }
  /capture/projects/{projectId}/documents:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [ProjectDocuments]
      operationId: listProjectDocuments
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DocumentStatus' }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Project Documents
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      { $ref: '#/components/schemas/ProjectDocumentSummary' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [ProjectDocuments]
      operationId: createProjectDocument
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectDocumentInput' }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDocument' }
        default: { $ref: '#/components/responses/Error' }
  /capture/projects/{projectId}/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [ProjectDocuments]
      operationId: getProjectDocument
      responses:
        '200':
          description: Project Document and immutable version history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDocument' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [ProjectDocuments]
      operationId: updateProjectDocumentDraft
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectDocumentInput' }
      responses:
        '200':
          description: Updated draft or a new draft version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDocument' }
        default: { $ref: '#/components/responses/Error' }
  /capture/projects/{projectId}/documents/{documentId}/file:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
    put:
      tags: [ProjectDocuments]
      operationId: uploadProjectDocumentFile
      description: Uploads one PDF or DOCX (maximum 20 MB) to an owned draft version.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: X-File-Name
          in: header
          required: true
          schema: { type: string, maxLength: 540 }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
          application/vnd.openxmlformats-officedocument.wordprocessingml.document:
            schema: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/ProjectDocument' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [ProjectDocuments]
      operationId: downloadProjectDocumentFile
      parameters:
        - name: version
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Private attachment download
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /capture/projects/{projectId}/documents/{documentId}/submit:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/CsrfToken'
    post:
      tags: [ProjectDocuments]
      operationId: submitProjectDocument
      responses:
        '200': { $ref: '#/components/responses/ProjectDocument' }
        default: { $ref: '#/components/responses/Error' }
  /capture/projects/{projectId}/documents/{documentId}/approve:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/CsrfToken'
    post:
      tags: [ProjectDocuments]
      operationId: approveProjectDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '200': { $ref: '#/components/responses/ProjectDocument' }
        default: { $ref: '#/components/responses/Error' }
  /capture/projects/{projectId}/documents/{documentId}/request-changes:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/CsrfToken'
    post:
      tags: [ProjectDocuments]
      operationId: requestProjectDocumentChanges
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '200': { $ref: '#/components/responses/ProjectDocument' }
        default: { $ref: '#/components/responses/Error' }
  /capture/projects/{projectId}/documents/{documentId}/reject:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/CsrfToken'
    post:
      tags: [ProjectDocuments]
      operationId: rejectProjectDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '200': { $ref: '#/components/responses/ProjectDocument' }
        default: { $ref: '#/components/responses/Error' }
  /capture/projects/{projectId}/documents/{documentId}/archive:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/CsrfToken'
    post:
      tags: [ProjectDocuments]
      operationId: archiveProjectDocument
      responses:
        '200': { $ref: '#/components/responses/ProjectDocument' }
        default: { $ref: '#/components/responses/Error' }
  /capture/projects/{projectId}/work-report-settings:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [WorkReports]
      operationId: getWorkReportSettings
      parameters:
        - name: scope
          in: query
          schema: { $ref: '#/components/schemas/WorkReportScope' }
      responses:
        '200':
          description: Active reporting frequency and two-tier governance metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkReportSettings' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [WorkReports]
      operationId: updateWorkReportSettings
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: scope
          in: query
          schema: { $ref: '#/components/schemas/WorkReportScope' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [frequency]
              properties:
                frequency: { $ref: '#/components/schemas/ReportFrequency' }
                scope: { $ref: '#/components/schemas/WorkReportScope' }
      responses:
        '200':
          description: Updated reporting cadence for the selected governance tier
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkReportSettings' }
        default: { $ref: '#/components/responses/Error' }
  /capture/projects/{projectId}/work-reports:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [WorkReports]
      operationId: listWorkReports
      parameters:
        - name: scope
          in: query
          schema: { $ref: '#/components/schemas/WorkReportScope' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/WorkReportStatus' }
        - name: memberId
          in: query
          schema: { $ref: '#/components/schemas/ObjectId' }
        - name: period
          in: query
          schema: { type: string, enum: [CURRENT, ALL] }
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Reports in the actor's allowed Project governance scope
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WorkReport' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  scope: { $ref: '#/components/schemas/WorkReportScope' }
                  summary:
                    { $ref: '#/components/schemas/WorkReportSummaryCounts' }
                  currentPeriod:
                    type: object
                    required: [periodStart, periodEnd, dueAt, frequency]
                    properties:
                      periodStart: { type: string, format: date-time }
                      periodEnd: { type: string, format: date-time }
                      dueAt: { type: string, format: date-time }
                      frequency:
                        { $ref: '#/components/schemas/ReportFrequency' }
                  roster:
                    type: array
                    items:
                      { $ref: '#/components/schemas/WorkReportRosterEntry' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [WorkReports]
      operationId: saveCurrentWorkReportDraft
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: scope
          in: query
          schema: { $ref: '#/components/schemas/WorkReportScope' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkReportInput' }
      responses:
        '200':
          description: Current reporting period draft saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkReport' }
        default: { $ref: '#/components/responses/Error' }
  /capture/projects/{projectId}/work-reports/{reportId}/file:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ReportId'
    put:
      tags: [WorkReports]
      operationId: uploadWorkReportFile
      description: Uploads a private attachment (up to 20 MB) to an owned editable Work Report draft.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: X-File-Name
          in: header
          required: true
          schema: { type: string, maxLength: 540 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/WorkReport' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [WorkReports]
      operationId: downloadWorkReportFile
      responses:
        '200':
          description: Private Work Report attachment download
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /capture/projects/{projectId}/work-reports/{reportId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ReportId'
    get:
      tags: [WorkReports]
      operationId: getWorkReport
      responses:
        '200':
          description: Work Report visible under Project policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkReport' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [WorkReports]
      operationId: updateWorkReportDraft
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkReportInput' }
      responses:
        '200': { $ref: '#/components/responses/WorkReport' }
        default: { $ref: '#/components/responses/Error' }
  /capture/projects/{projectId}/work-reports/{reportId}/submit:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ReportId'
      - $ref: '#/components/parameters/CsrfToken'
    post:
      tags: [WorkReports]
      operationId: submitWorkReport
      responses:
        '200': { $ref: '#/components/responses/WorkReport' }
        default: { $ref: '#/components/responses/Error' }
  /capture/projects/{projectId}/work-reports/{reportId}/approve:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ReportId'
      - $ref: '#/components/parameters/CsrfToken'
    post:
      tags: [WorkReports]
      operationId: approveWorkReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '200': { $ref: '#/components/responses/WorkReport' }
        default: { $ref: '#/components/responses/Error' }
  /capture/projects/{projectId}/work-reports/{reportId}/request-changes:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ReportId'
      - $ref: '#/components/parameters/CsrfToken'
    post:
      tags: [WorkReports]
      operationId: requestWorkReportChanges
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '200': { $ref: '#/components/responses/WorkReport' }
        default: { $ref: '#/components/responses/Error' }
  /capture/projects/{projectId}/work-reports/{reportId}/reject:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ReportId'
      - $ref: '#/components/parameters/CsrfToken'
    post:
      tags: [WorkReports]
      operationId: rejectWorkReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '200': { $ref: '#/components/responses/WorkReport' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
    bearerSession:
      type: http
      scheme: bearer
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    NoteId:
      name: noteId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    ReportId:
      name: reportId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    OrganizationId:
      name: x-organization-id
      in: header
      required: false
      schema: { $ref: '#/components/schemas/ObjectId' }
    CsrfToken:
      name: x-csrf-token
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 256 }
  responses:
    Error:
      description: Structured API error
      content:
        application/json:
          schema:
            type: object
            required: [code, message, details, requestId]
            properties:
              code: { type: string }
              message: { type: string }
              details: { type: object }
              requestId: { type: [string, 'null'] }
    ProjectDocument:
      description: Project Document
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProjectDocument' }
    WorkReport:
      description: Work Report
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkReport' }
  schemas:
    ObjectId:
      type: string
      pattern: '^[a-fA-F0-9]{24}$'
    Pagination:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    Permissions:
      type: object
      required: [canCreate, canEdit, canSubmit, canReview, canConfigure]
      properties:
        canCreate: { type: boolean }
        canEdit: { type: boolean }
        canDelete: { type: boolean }
        canSubmit: { type: boolean }
        canReview: { type: boolean }
        canConfigure: { type: boolean }
    TaskNoteInput:
      type: object
      additionalProperties: false
      required: [title, accomplishments, approach, reason]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        accomplishments: { type: string, minLength: 1, maxLength: 10000 }
        approach: { type: string, minLength: 1, maxLength: 10000 }
        reason: { type: string, minLength: 1, maxLength: 5000 }
    TaskNote:
      allOf:
        - $ref: '#/components/schemas/TaskNoteInput'
        - type: object
          required:
            [
              id,
              projectId,
              taskId,
              authorId,
              authorName,
              type,
              status,
              createdAt,
              updatedAt,
              permissions,
            ]
          properties:
            id: { $ref: '#/components/schemas/ObjectId' }
            projectId: { $ref: '#/components/schemas/ObjectId' }
            taskId: { $ref: '#/components/schemas/ObjectId' }
            authorId: { $ref: '#/components/schemas/ObjectId' }
            authorName: { type: string }
            type: { const: TASK_NOTE }
            status: { const: CONFIRMED }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            permissions: { $ref: '#/components/schemas/Permissions' }
            contentMarkdown: { type: string, maxLength: 30000 }
            contentSchemaVersion: { const: 2 }
            currentVersionNumber: { type: integer, minimum: 1 }
            aiChatSource: { $ref: '#/components/schemas/AiChatTaskNoteSource' }
    TaskNoteEditorSaveInput:
      type: object
      additionalProperties: false
      required: [operationId, expectedRevision, discardOriginalConfirmed]
      properties:
        operationId: { type: string, format: uuid }
        expectedRevision: { type: integer, minimum: 1 }
        discardOriginalConfirmed: { type: boolean }
        aiChatSource: { $ref: '#/components/schemas/AiChatTaskNoteSourceInput' }
    AiChatTaskNoteSourceInput:
      type: object
      additionalProperties: false
      required: [threadId, messageId, citations, sessionCitations]
      properties:
        threadId: { type: string, minLength: 1, maxLength: 200 }
        messageId: { type: string, minLength: 1, maxLength: 200 }
        citations:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AiChatTaskNoteCitationInput' }
        sessionCitations:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AiChatTaskNoteSessionCitationInput' }
    AiChatTaskNoteCitationInput:
      type: object
      additionalProperties: false
