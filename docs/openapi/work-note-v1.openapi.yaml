          { $ref: '#/components/schemas/WorkReportTierSettingsSummary' }
        leaderSettings:
          { $ref: '#/components/schemas/WorkReportTierSettingsSummary' }
    WorkReportSummaryCounts:
      type: object
      required:
        [
          total,
          draft,
          pendingReview,
          changesRequested,
          approved,
          rejected,
          overdue,
        ]
      properties:
        total: { type: integer, minimum: 0 }
        draft: { type: integer, minimum: 0 }
        pendingReview: { type: integer, minimum: 0 }
        changesRequested: { type: integer, minimum: 0 }
        approved: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        overdue: { type: integer, minimum: 0 }
    WorkReportRosterEntry:
      type: object
      required: [userId, fullName, joinedAt, status, dueAt]
      properties:
        userId: { $ref: '#/components/schemas/ObjectId' }
        fullName: { type: string }
        joinedAt: { type: string, format: date-time }
        reportId: { $ref: '#/components/schemas/ObjectId' }
        status:
          type: string
          enum:
            [
              NOT_STARTED,
              DRAFT,
              PENDING_REVIEW,
              APPROVED,
              CHANGES_REQUESTED,
              REJECTED,
              OVERDUE,
            ]
        dueAt: { type: string, format: date-time }
        submittedAt: { type: string, format: date-time }
        reviewedAt: { type: string, format: date-time }
    WorkReportStatus:
      type: string
      enum:
        [DRAFT, PENDING_REVIEW, APPROVED, CHANGES_REQUESTED, REJECTED, OVERDUE]
    WorkReportInput:
      type: object
      additionalProperties: false
