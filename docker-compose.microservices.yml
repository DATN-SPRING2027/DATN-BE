services:
  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  mongo1:
    image: mongo:7.0
    command: mongod --bind_ip_all --replSet rs0
    volumes:
      - mongo1-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo2:
    image: mongo:7.0
    command: mongod --bind_ip_all --replSet rs0
    volumes:
      - mongo2-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo3:
    image: mongo:7.0
    command: mongod --bind_ip_all --replSet rs0
    volumes:
      - mongo3-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    volumes:
      - ./deploy/mongo/replica-init.js:/scripts/replica-init.js:ro
    command: ["mongosh", "--host", "mongo1:27017", "/scripts/replica-init.js"]

  api-gateway:
    <<: &backend-service
      build: .
      env_file:
        - .env.example
      environment:
        REDIS_HOST: redis
        OTEL_SERVICE_NAME: continuum-api-gateway
        OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
        OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
        OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
        OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
        OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
        GATEWAY_PORT: 3000
        IAM_SERVICE_URL: http://iam:3001
        CHAT_SERVICE_URL: http://chat:3005
        IAM_GATEWAY_SECRET: ${IAM_GATEWAY_SECRET:?Set a distinct Gateway-to-IAM secret}
        GATEWAY_TRUSTED_PROXY_CIDRS: ${GATEWAY_TRUSTED_PROXY_CIDRS:?Set the trusted BFF or edge proxy CIDR}
        SWAGGER_ENABLED: "false"
    depends_on:
      redis:
        condition: service_healthy
      iam:
        condition: service_started
    command: node dist/gateway/main.js
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  nginx:
    image: nginx:1.27-alpine
    profiles: ["edge"]
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:-./deploy/tls}/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_CERT_DIR:-./deploy/tls}/privkey.pem:/etc/nginx/tls/privkey.pem:ro

  iam:
    <<: *backend-service
    environment:
      OTEL_SERVICE_NAME: continuum-iam
      INFRA_ENABLED: "true"
      SERVICE_PORT: 3001
      MONGODB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
      SERVICE_DATABASE: continuum_iam
      JWT_SECRET: ${JWT_SECRET:?Set the IAM JWT secret}
      IAM_GATEWAY_SECRET: ${IAM_GATEWAY_SECRET:?Set a distinct Gateway-to-IAM secret}
      PLATFORM_SERVICE_OPS_SECRET: ${PLATFORM_SERVICE_OPS_SECRET:?Set the internal IAM-to-Jira operations secret}
      REDIS_HOST: redis
      IAM_SERVICE_URL: http://iam:3001
      CAPTURE_SERVICE_URL: http://capture:3002
      JIRA_SERVICE_URL: http://jira:3003
      LIFECYCLE_SERVICE_URL: http://lifecycle:3004
      CHAT_SERVICE_URL: http://chat:3005
      HANDOVER_SERVICE_URL: http://handover:3006
      INGESTION_SERVICE_URL: http://ingestion:3007
      NOTIFICATION_SERVICE_URL: http://notification:3008
    depends_on:
      redis:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    command: node dist/services/iam/main.js
  capture:
    <<: *backend-service
    environment:
      OTEL_SERVICE_NAME: continuum-capture
      INFRA_ENABLED: "true"
      SERVICE_PORT: 3002
      MONGODB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
      SERVICE_DATABASE: continuum_capture
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    command: node dist/services/capture/main.js
  jira:
    <<: *backend-service
    environment:
      OTEL_SERVICE_NAME: continuum-jira
      INFRA_ENABLED: "true"
      SERVICE_PORT: 3003
      MONGODB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
      SERVICE_DATABASE: continuum_jira
      REDIS_HOST: redis
      PLATFORM_SERVICE_OPS_SECRET: ${PLATFORM_SERVICE_OPS_SECRET:?Set the internal IAM-to-Jira operations secret}
    depends_on:
      redis:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    command: node dist/services/jira/main.js
  lifecycle:
    <<: *backend-service
    environment:
      OTEL_SERVICE_NAME: continuum-lifecycle
      INFRA_ENABLED: "true"
      SERVICE_PORT: 3004
      MONGODB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
      SERVICE_DATABASE: continuum_lifecycle
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    command: node dist/services/lifecycle/main.js
  chat:
    <<: *backend-service
    environment:
      OTEL_SERVICE_NAME: continuum-chat
      INFRA_ENABLED: "true"
      SERVICE_PORT: 3005
      MONGODB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
      SERVICE_DATABASE: continuum_chat
      REDIS_HOST: redis
      IAM_SERVICE_URL: http://iam:3001
      CHAT_ALLOWED_ORIGINS: ${CHAT_ALLOWED_ORIGINS:-http://localhost:3000}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      CHAT_S3_BUCKET: ${CHAT_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      iam:
        condition: service_started
    command: node dist/services/chat/main.js
  handover:
    <<: *backend-service
    environment:
      OTEL_SERVICE_NAME: continuum-handover
      INFRA_ENABLED: "true"
      SERVICE_PORT: 3006
      MONGODB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
      SERVICE_DATABASE: continuum_handover
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    command: node dist/services/handover/main.js
  ingestion:
    <<: *backend-service
    environment:
      OTEL_SERVICE_NAME: continuum-ingestion
      INFRA_ENABLED: "true"
      SERVICE_PORT: 3007
      MONGODB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
      SERVICE_DATABASE: continuum_ingestion
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    command: node dist/services/ingestion/main.js
  notification:
    <<: *backend-service
    environment:
      OTEL_SERVICE_NAME: continuum-notification
      INFRA_ENABLED: "true"
      SERVICE_PORT: 3008
      MONGODB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
      SERVICE_DATABASE: continuum_notification
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    command: node dist/services/notification/main.js

volumes:
  redis-data:
  mongo1-data:
  mongo2-data:
  mongo3-data:
